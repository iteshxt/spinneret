[project]
name = "spinneret"
version = "0.1.0"
description = "Small, fast text-to-SQL: fine-tuned T5 with a schema ranker, trained on Spider"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlparse>=0.5",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "huggingface_hub>=0.34",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "nltk>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Heavy training stack: installed on the Colab VM (fast network) and, later, locally for serving.
train = [
    "torch>=2.4",
    "accelerate>=0.33",
    "tensorboard>=2.16",
]

[project.scripts]
spinneret = "spinneret.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spinneret"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # multi-line word lists read better as "...".split()

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running checks over the whole dataset",
    "data: needs the Spider data downloaded to data/raw/spider",
    "network: needs network access (e.g. Hugging Face tokenizer download)",
]
addopts = "-ra"
